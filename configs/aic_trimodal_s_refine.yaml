# ============================================================
# 三模态目标检测 - yolov8s 融合模型「两阶段精修」配置
# 基于 runs/train_s/best.pt (36.4 分) 做尺度增强精修, 解锁高分辨率推理
# 借鉴 SAR-OBB 国一方案: freeze backbone + 极低 lr + 温和 scale 抖动 + 多尺度
# ============================================================

names:
  0: person
  1: boat
  2: animal
  3: seat
  4: sign
  5: bicycle
  6: car
  7: ball
  8: light
  9: garbage can
  10: uav
  11: tricycle

nc: 12

modalities: [rgb, ir, depth]

data:
  root: 初赛数据集-面向城市场景的多模态目标检测/训练集/AIC2026_Train_2000
  test_root: 初赛数据集-面向城市场景的多模态目标检测/测试集/AIC2026_PHASE_1_1000
  visible_dir: visible
  infrared_dir: infrared
  depth_dir: depth
  label_dir: labels
  val_ratio: 0.2
  seed: 42

depth:
  max_val: 19999

model:
  yaml: yolov8s.yaml
  scale: s
  pretrained: yolov8s.pt
  ch: 5

train:
  imgsz: 832                 # 高分辨率精修 (比 640 提升小目标; 后续可 960/1280)
  batch_size: 2              # 832 下显存翻倍, batch 降到 2 (4GB)
  epochs: 2                  # 精修只需少量 epoch (smoke test 用 2; 全量精修可 2-3)
  lr0: 0.00005               # 极低学习率, 只做「抛光」不破坏已学特征 (勿用 5e-5, YAML 会当字符串)
  lrf: 0.01
  weight_decay: 0.0005
  momentum: 0.937
  warmup_epochs: 0           # 精修阶段不 warmup, 第一轮即 lr0
  workers: 4
  device: 0
  save_dir: runs/refine_s    # 独立目录, 不覆盖 yolov8s 成果
  resume: false
  # ---- 两阶段精修核心 ----
  init_weights: runs/train_s/best.pt   # 从 yolov8s 最优权重继续
  freeze: 10                 # 冻结前 10 层 (stem+backbone), 只训 neck+head
  # ---- 增强: 温和 scale 抖动 (关 Mosaic/旋转/剪切, 保留翻转) ----
  mosaic_prob: 0.0
  affine_prob: 1.0           # 每样本都做仿射
  affine_degrees: 0.0        # 不旋转
  affine_translate: 0.05     # 轻微平移
  affine_scale: 0.30         # ±30% 尺度抖动 (关键: 让 DFL 学会跨尺度宽高)
  affine_shear: 0.0          # 不剪切
  flip_prob: 0.5
  # ---- EMA (关闭) ----
  ema: false

infer:
  imgsz: 832
  conf_thres: 0.25
  iou_thres: 0.7
  max_det: 100
  device: 0
